global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: 'laravel-app'
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['localhots'] # nessa parte coloque o dominio que sera monitorado caso não seja remoto localhost
    basic_auth:
      username: 'monitor'
      password: 'your-secret-password'
    scheme: https  # Adicione esta linha se estiver usando HTTPS
    tls_config:
      insecure_skip_verify: true  # Use com cuidado, apenas para desenvolvimento

  - job_name: 'prometheus'
    static_configs:
      - targets: ['172.21.0.3:9090']
