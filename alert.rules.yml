groups:
  - name: laravel_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on Laravel application"
          description: "Error rate is {{ $value }} per second"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_response_time_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }} seconds"

      - alert: ServiceDown
        expr: up{job="laravel-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Laravel application is down"
          description: "The Laravel application has been down for more than 1 minute"

      - alert: TenantDatabaseIssues
        expr: up{job="laravel-app"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tenant database connection issues"
          description: "Unable to connect to tenant databases"
