name: Deploy para Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    environment: dploy_producao

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      # 1. Faz login no Docker Hub
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. Configura o construtor
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Constrói e Envia direto para o Docker Hub
      # O GitHub não guarda nada, ele funciona apenas como um "tubo" de envio.
      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          # AQUI: Substitua pelo nome do seu repo no Docker Hub
          tags: marlonmarques/facilfinance:latest
          # Cache para economizar seus minutos de build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Avisa o Coolify para baixar a imagem nova do Docker Hub
      - name: Autorizar IP do GitHub no Cloudflare
        run: |
          IP=$(curl -s https://api64.ipify.org)
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/firewall/access_rules/rules" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "mode": "whitelist",
              "configuration": { "target": "ip", "value": "'$IP'" },
              "notes": "Deploy Temporario GitHub"
            }')
          RULE_ID=$(echo $RESPONSE | jq -r '.result.id')
          echo "RULE_ID=$RULE_ID" >> $GITHUB_ENV
          sleep 10

      - name: Disparar Deploy no Coolify
        run: |
          curl -f -X POST "${{ secrets.COOLIFY_WEBHOOK }}" \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
          -H "Content-Type: application/json" \
          -H "User-Agent: PostmanRuntime/7.32.3"

      - name: Limpar IP no Cloudflare
        if: always()
        run: |
          if [ -n "$RULE_ID" ] && [ "$RULE_ID" != "null" ]; then
            curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/firewall/access_rules/rules/$RULE_ID" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}"
          fi
